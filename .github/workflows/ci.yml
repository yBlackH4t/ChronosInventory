name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Check version consistency
        run: python scripts/check_versions.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check .

      - name: Run backend tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # Compila o app Tauri (sem instalador, sem publicar nada). Na main grava as
  # dependencias Rust no cache que o Release (tag) le, para nao recompilar tudo
  # do zero. Nos PRs so confere que o Rust compila, usando o cache da main.
  warm-release-cache:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        run: rustup update stable && rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          shared-key: tauri-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # O tauri exige o backend empacotado; para o cache basta um arquivo vazio.
      - name: Placeholder do backend
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin/estoque_backend_lib | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/bin/estoque_backend-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/bin/estoque_backend.exe | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/bin/estoque_backend_lib/.keep | Out-Null
        working-directory: frontend

      - name: Compile Tauri (sem instalador)
        run: npx tauri build --no-bundle
        working-directory: frontend
