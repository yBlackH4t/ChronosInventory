<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronos Casa</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Chronos Casa <small>prova de conceito</small></h1>

      <label for="pc">Endereço do Chronos no computador</label>
      <input id="pc" inputmode="url" placeholder="http://192.168.0.10:8000" />

      <button id="scan" class="primary">Bipar com a câmera</button>

      <label for="manual">Ou digite / use um leitor Bluetooth</label>
      <form id="manual-form">
        <input id="manual" placeholder="Código de barras" autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>

      <section id="result" hidden>
        <p class="code"></p>
        <p class="name"></p>
      </section>
      <p id="status"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
